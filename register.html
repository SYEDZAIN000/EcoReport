<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account - EcoReport</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="index.html">EcoReport</a>
    <div class="ms-auto">
      <a class="btn btn-eco-outline" href="login.html">Sign in</a>
    </div>
  </div>
</nav>

<main class="container">
  <div class="auth-wrap">
    <h1 class="mb-1">Create your account</h1>
    <p class="form-hint mb-4">You need an account so you can track what happens to your reports.</p>

    <!-- PHP NOTE: rename to register.php, action="process_register.php" method="post".
         Store the password with password_hash(), never as plain text. -->
    <form class="eco-card" action="process_register.php" method="post" novalidate>

      <div class="mb-3">
        <label class="form-label" for="fullName">Full name</label>
        <input type="text" class="form-control" id="fullName" name="full_name" required>
        <div class="invalid-feedback">Enter your name.</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="email">Email address</label>
        <input type="email" class="form-control" id="email" name="email" required>
        <div class="invalid-feedback">Enter a valid email address.</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="phone">Mobile number</label>
        <input type="tel" class="form-control" id="phone" name="phone"
               pattern="[0-9]{10}" placeholder="10 digits" required>
        <div class="invalid-feedback">Enter a 10-digit mobile number.</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" name="password"
               minlength="8" required>
        <div class="form-hint mt-1">At least 8 characters.</div>
        <div class="invalid-feedback">Use at least 8 characters.</div>
      </div>

      <div class="mb-4">
        <label class="form-label" for="confirmPassword">Confirm password</label>
        <input type="password" class="form-control" id="confirmPassword" required>
        <div class="invalid-feedback">Both passwords must be the same.</div>
      </div>

      <button type="submit" class="btn btn-eco w-100">Create account</button>

      <p class="form-hint text-center mt-3 mb-0">
        Already registered? <a href="login.html">Sign in</a>
      </p>
    </form>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/script.js"></script>
</body>
</html>
