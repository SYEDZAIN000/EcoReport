<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - EcoReport</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="index.html">EcoReport</a>
    <div class="ms-auto">
      <a class="btn btn-eco-outline" href="register.html">Create account</a>
    </div>
  </div>
</nav>

<main class="container">
  <div class="auth-wrap">
    <h1 class="mb-1">Sign in</h1>
    <p class="form-hint mb-4">Sign in to report an issue and follow its status.</p>

    <!-- PHP NOTE: rename to login.php, action="process_login.php" method="post" -->
    <form class="eco-card" action="process_login.php" method="post" novalidate>

      <!-- Show this block from PHP when the login fails:
           <div class="alert alert-danger">Email or password is incorrect.</div> -->

      <div class="mb-3">
        <label class="form-label" for="email">Email address</label>
        <input type="email" class="form-control" id="email" name="email"
               placeholder="you@example.com" required>
        <div class="invalid-feedback">Enter a valid email address.</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" name="password" required>
        <div class="invalid-feedback">Enter your password.</div>
      </div>

      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="remember" name="remember">
        <label class="form-check-label form-hint" for="remember">Keep me signed in</label>
      </div>

      <button type="submit" class="btn btn-eco w-100">Sign in</button>

      <p class="form-hint text-center mt-3 mb-0">
        New here? <a href="register.html">Create an account</a>
      </p>
    </form>

    <p class="form-hint text-center mt-3">
      Are you from a department? <a href="admin.html">Authority sign in</a>
    </p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/script.js"></script>
</body>
</html>
